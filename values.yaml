# OpenClaw Helm Chart - Default Values

replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 18789

# Gateway API HTTPRoute configuration
gateway:
  enabled: false
  # Parent gateway reference
  parentRef:
    name: ""
    namespace: ""
  hostname: ""

# Network policy
networkPolicy:
  enabled: false
  # Additional egress rules beyond DNS and HTTPS
  additionalEgress: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe: {}
  # httpGet:
  #   path: /readyz
  #   port: http
  # initialDelaySeconds: 10
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 3

resources: {}

# Persistence for OpenClaw data (~/.openclaw)
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  # Bind to a specific PersistentVolume
  volumeName: ""

# OpenClaw configuration
openclaw:
  # Reference to an existing secret containing the LLM API key
  apiKeySecret: ""
  apiKeySecretKey: "api-key"
  # Environment variable name for the API key (e.g. ANTHROPIC_API_KEY, OPENAI_API_KEY)
  apiKeyEnvVar: "ANTHROPIC_API_KEY"
  # Default model (e.g. claude-sonnet-4-6, claude-opus-4-6)
  defaultModel: ""
  # Reference to an existing secret containing the gateway token
  gatewayTokenSecret: ""
  gatewayTokenSecretKey: "gateway-token"
  # Allowed origins for the control UI (e.g. ["https://openclaw.example.com"])
  controlUiAllowedOrigins: []
  # Trusted proxy CIDRs for X-Forwarded-For header processing (e.g. ["10.200.0.0/24"])
  trustedProxies: []
  # Extra environment variables
  env: []
  # Extra openclaw.json config merged into the seed (for one-time first-boot settings)
  # Example:
  #   extraConfig:
  #     agents:
  #       defaults:
  #         model:
  #           primary: "anthropic/claude-sonnet-4-6"
  extraConfig: {}

# Rootless Podman sidecar for sandbox support
# Requires Kubernetes User Namespaces (hostUsers: false, K8s >= 1.33, containerd >= 2.0, kernel >= 6.3)
podman:
  enabled: false
  image:
    repository: quay.io/podman/stable
    tag: "latest"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: Unconfined
    capabilities:
      add:
        - SYS_ADMIN
        - SETUID
        - SETGID
      drop:
        - ALL
  resources: {}
  # Size limit for ephemeral container/image storage
  storageSize: 10Gi

# Headless Chromium sidecar for browser tool support (CDP on port 9222)
browser:
  enabled: false
  image:
    repository: chromedp/headless-shell
    tag: "latest"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  resources: {}
  # Shared memory size for Chromium (mounted as tmpfs at /dev/shm)
  shmSize: 1Gi

# Sideloads the openshell CLI (github.com/NVIDIA/OpenShell) into the openclaw
# container via an initContainer, for agents.defaults.sandbox.backend:
# "openshell". Downloads the pinned, checksum-verified static binary release
# rather than fetching it at agent runtime - same provisioning-time model as
# the podman/browser sidecar images above. Point
# plugins.entries.openshell.config.command in extraConfig at
# "{{ .Values.openshellCli.installPath }}/openshell".
openshellCli:
  enabled: false
  # OpenShell release version. Must match a real GitHub release tag
  # (github.com/NVIDIA/OpenShell/releases) with an
  # openshell-x86_64-unknown-linux-musl.tar.gz asset.
  version: "0.0.106"
  # sha256 of that asset, from the release's openshell-checksums-sha256.txt.
  # Verified before extraction; the initContainer fails closed on mismatch.
  checksum: "d1a885a91b3e5aaa006c36aca95dc78bed0638c1ba1a79b55f1da93211b8a0a0"
  installPath: /opt/openshell/bin
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  resources: {}

# Additional volumes
volumes: []
# Additional volume mounts for the openclaw container
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
